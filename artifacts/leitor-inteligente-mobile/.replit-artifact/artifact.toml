kind = "mobile"
previewPath = "/mobile/"
title = "Leitor Inteligente Mobile"
description = "Companheiro móvel offline para revisar vocabulário, expressões idiomáticas e phrasal verbs das preparações de leitura criadas no computador."
version = "1.0.0"
id = "artifacts/leitor-inteligente-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/mobile/" ]
localPort = 25573

[services.development]
run = "pnpm --filter @workspace/leitor-inteligente-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/leitor-inteligente-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/leitor-inteligente-mobile", "run", "serve" ]

[services.env]
PORT = "25573"
BASE_PATH = "/mobile/"
