spring.application.name=leitor-inteligente-api
server.port=${PORT:8080}

# PostgreSQL can be configured with SPRING_DATASOURCE_* or the individual PG* variables.
# Replit's workflow supplies the SPRING_DATASOURCE_* values explicitly.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:leitor_inteligente}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${PGUSER:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${PGPASSWORD:postgres}}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.sql.init.mode=never
server.error.include-message=always