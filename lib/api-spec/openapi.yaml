openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: library
    description: Books and study materials
  - name: study
    description: Study sessions and progress
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /ollama/models:
    get:
      operationId: listOllamaModels
      tags: [study]
      summary: List locally installed Ollama models
      parameters:
        - name: endpoint
          in: query
          required: true
          schema:
            type: string
          description: Base URL of the local Ollama instance.
      responses:
        "200":
          description: Locally available Ollama models
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OllamaModelCatalog"
  /openrouter/models:
    get:
      operationId: listOpenRouterModels
      tags: [study]
      summary: List models available through OpenRouter
      parameters:
        - name: endpoint
          in: query
          required: false
          schema:
            type: string
            default: https://openrouter.ai/api/v1
          description: OpenRouter API base URL.
      responses:
        "200":
          description: Models available to the configured OpenRouter key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OllamaModelCatalog"
  /books:
    get:
      operationId: listBooks
      tags: [library]
      summary: List books in the library
      responses:
        "200":
          description: Books
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Book"
    post:
      operationId: importBook
      tags: [library]
      summary: Import a book or article
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportBookRequest"
      responses:
        "201":
          description: Imported book
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Book"
  /books/{bookId}:
    get:
      operationId: getBook
      tags: [library]
      summary: Get a book with its study plan
      parameters:
        - $ref: "#/components/parameters/BookId"
      responses:
        "200":
          description: Book detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookDetail"
  /dashboard:
    get:
      operationId: getDashboard
      tags: [study]
      summary: Get study dashboard summary
      responses:
        "200":
          description: Dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
  /dictionaries:
    get:
      operationId: searchDictionaryEntries
      tags: [study]
      summary: Search private dictionary entries
      parameters:
        - name: query
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Matching private dictionary entries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DictionaryEntrySummary" }
  /dictionaries/import:
    post:
      operationId: importPrivateDictionary
      tags: [study]
      summary: Import a private EPUB dictionary
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DictionaryImportRequest" }
      responses:
        "201":
          description: Imported private source summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DictionaryImportResult" }
  /dictionaries/{entryId}:
    get:
      operationId: getDictionaryEntry
      tags: [study]
      summary: Get an imported dictionary entry
      parameters:
        - $ref: "#/components/parameters/DictionaryEntryId"
      responses:
        "200":
          description: Dictionary entry and locally generated examples
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DictionaryEntryDetail" }
  /dictionaries/{entryId}/examples:
    post:
      operationId: generateDictionaryExample
      tags: [study]
      summary: Generate a local Ollama example for a private entry
      parameters:
        - $ref: "#/components/parameters/DictionaryEntryId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DictionaryExampleRequest" }
      responses:
        "201":
          description: Original local example
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DictionaryExample" }
  /dictionaries/{entryId}/cards:
    post:
      operationId: createDictionaryStudyCard
      tags: [study]
      summary: Create a study card from a private dictionary entry
      parameters:
        - $ref: "#/components/parameters/DictionaryEntryId"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DictionaryCardRequest" }
      responses:
        "201":
          description: Created study card
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DictionaryStudyCard" }
components:
  parameters:
    BookId:
      name: bookId
      in: path
      required: true
      schema:
        type: string
    DictionaryEntryId:
      name: entryId
      in: path
      required: true
      schema:
        type: string
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    OllamaModelCatalog:
      type: object
      properties:
        models:
          type: array
          items:
            $ref: "#/components/schemas/OllamaModel"
      required:
        - models
    OllamaModel:
      type: object
      properties:
        name:
          type: string
      required:
        - name
    Book:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        author: { type: string }
        sourceType: { type: string, enum: [EPUB, ARTICLE] }
        status: { type: string, enum: [READY, PROCESSING, DRAFT] }
        level: { type: string }
        progress: { type: number }
        coverColor: { type: string }
        updatedAt: { type: string }
      required: [id, title, author, sourceType, status, level, progress, coverColor, updatedAt]
    BookDetail:
      allOf:
        - $ref: "#/components/schemas/Book"
        - type: object
          properties:
            plan:
              $ref: "#/components/schemas/StudyPlan"
            chapters:
              type: array
              items:
                $ref: "#/components/schemas/Chapter"
          required: [plan, chapters]
    Chapter:
      type: object
      properties:
        id: { type: string }
        position: { type: number, description: Chapter order, integer: true }
        title: { type: string }
        content: { type: string }
        wordCount: { type: number, description: Number of words in the chapter, integer: true }
      required: [id, position, title, content, wordCount]
    StudyPlan:
      type: object
      properties:
        vocabulary:
          type: array
          items: { $ref: "#/components/schemas/StudyItem" }
        idioms:
          type: array
          items: { $ref: "#/components/schemas/StudyItem" }
        phrasalVerbs:
          type: array
          items: { $ref: "#/components/schemas/StudyItem" }
        visualCards:
          type: array
          items: { $ref: "#/components/schemas/VisualStudyCard" }
        linguisticDecks:
          type: array
          items: { $ref: "#/components/schemas/LinguisticDeck" }
        semanticMap:
          $ref: "#/components/schemas/SemanticMap"
      required: [vocabulary, idioms, phrasalVerbs]
    StudyItem:
      type: object
      properties:
        term: { type: string }
        meaning: { type: string }
        example: { type: string }
        pronunciation: { type: string }
        difficulty: { type: string }
      required: [term, meaning, example, pronunciation, difficulty]
    VisualStudyCard:
      type: object
      properties:
        term: { type: string }
        meaning: { type: string }
        example: { type: string }
        visualCue: { type: string }
        technique: { type: string }
        pronunciation: { type: string }
        difficulty: { type: string }
      required: [term, meaning, example, visualCue, technique, pronunciation, difficulty]
    LinguisticDeck:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        purpose: { type: string }
        items:
          type: array
          items: { $ref: "#/components/schemas/StudyItem" }
      required: [id, title, purpose, items]
    SemanticMap:
      type: object
      properties:
        nodes:
          type: array
          items: { $ref: "#/components/schemas/SemanticNode" }
        connections:
          type: array
          items: { $ref: "#/components/schemas/SemanticConnection" }
      required: [nodes, connections]
    SemanticNode:
      type: object
      properties:
        id: { type: string }
        label: { type: string }
        description: { type: string }
      required: [id, label, description]
    SemanticConnection:
      type: object
      properties:
        fromId: { type: string }
        toId: { type: string }
        relationship: { type: string }
      required: [fromId, toId, relationship]
    ImportBookRequest:
      type: object
      properties:
        title: { type: string }
        author: { type: string }
        sourceType: { type: string, enum: [EPUB, ARTICLE] }
        content:
          type: string
          description: For EPUB, a base64 data URL containing the complete file. For ARTICLE, the article URL.
        fileName:
          type: string
          description: Original EPUB file name, used to validate the upload.
        ollamaEndpoint:
          type: string
          description: Local Ollama base URL.
        ollamaModel:
          type: string
          description: Model used to prepare the plan.
        provider:
          type: string
          enum: [ollama, openrouter]
          description: Provider used to prepare the plan.
      required: [title, author, sourceType, content, ollamaEndpoint, ollamaModel, provider]
    DictionaryImportRequest:
      type: object
      properties:
        title: { type: string }
        publisher: { type: string }
        isbn: { type: string }
        fileName: { type: string }
        content: { type: string, description: Base64 data URL with the private EPUB file. }
        privateAcknowledged: { type: boolean }
      required: [title, fileName, content, privateAcknowledged]
    DictionarySourceSummary:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        publisher: { type: string }
        isbn: { type: string }
        entryCount: { type: number, description: Number of parsed entries, integer: true }
        createdAt: { type: string }
      required: [id, title, publisher, isbn, entryCount, createdAt]
    DictionaryImportResult:
      type: object
      properties:
        source: { $ref: "#/components/schemas/DictionarySourceSummary" }
        importedEntries: { type: number, integer: true }
        skippedLines: { type: number, integer: true }
        warnings:
          type: array
          items: { type: string }
      required: [source, importedEntries, skippedLines, warnings]
    DictionaryEntrySummary:
      type: object
      properties:
        id: { type: string }
        headword: { type: string }
        term: { type: string }
        translation: { type: string }
        partOfSpeech: { type: string }
        usageLabels:
          type: array
          items: { type: string }
        sourceTitle: { type: string }
        exampleCount: { type: number, integer: true }
      required: [id, headword, term, translation, partOfSpeech, usageLabels, sourceTitle, exampleCount]
    DictionarySense:
      type: object
      properties:
        id: { type: string }
        definition: { type: string }
        translation: { type: string }
      required: [id, definition, translation]
    DictionaryExample:
      type: object
      properties:
        id: { type: string }
        sentence: { type: string }
        translation: { type: string }
        explanation: { type: string }
        createdAt: { type: string }
      required: [id, sentence, translation, explanation, createdAt]
    DictionaryStudyCard:
      type: object
      properties:
        id: { type: string }
        headword: { type: string }
        term: { type: string }
        translation: { type: string }
        exampleId: { type: [string, "null"] }
      required: [id, term, translation]
    DictionaryEntryDetail:
      type: object
      properties:
        id: { type: string }
        term: { type: string }
        translation: { type: string }
        partOfSpeech: { type: string }
        usageLabels:
          type: array
          items: { type: string }
        source:
          type: object
          properties:
            title: { type: string }
            publisher: { type: string }
          required: [title, publisher]
        senses:
          type: array
          items: { $ref: "#/components/schemas/DictionarySense" }
        examples:
          type: array
          items: { $ref: "#/components/schemas/DictionaryExample" }
        cards:
          type: array
          items: { $ref: "#/components/schemas/DictionaryStudyCard" }
      required: [id, headword, term, translation, partOfSpeech, usageLabels, source, senses, examples, cards]
    DictionaryExampleRequest:
      type: object
      properties:
        provider: { type: string, enum: [ollama] }
        endpoint: { type: string }
        model: { type: string }
      required: [provider, endpoint, model]
    DictionaryCardRequest:
      type: object
      properties:
        exampleId: { type: string }
    Dashboard:
      type: object
      properties:
        minutesToday: { type: number }
        streak: { type: number }
        wordsLearned: { type: number }
        currentBook:
          $ref: "#/components/schemas/Book"
      required: [minutesToday, streak, wordsLearned, currentBook]

